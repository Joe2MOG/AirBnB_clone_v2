<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexbox & Grid Playground</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172233;
    }

    .app {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .intro {
      color: #657184;
      margin-bottom: 25px;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }

    .panel,
    .preview {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(20, 40, 80, 0.08);
    }

    .panel {
      padding: 20px;
    }

    .panel-header,
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .control {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d5dbe5;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    button {
      border: 0;
      background: transparent;
      color: #2f67f6;
      font-weight: bold;
      cursor: pointer;
    }

    .preview {
      overflow: hidden;
    }

    .preview-header {
      padding: 20px;
      margin: 0;
      border-bottom: 1px solid #e1e5eb;
    }

    .stage {
      min-height: 450px;
      padding: 25px;
      background: #f7f9fc;
    }

    #container {
      width: 100%;
      min-height: 350px;
      padding: 18px;
      border: 2px dashed #9eb5f4;
      border-radius: 10px;
      background: white;
    }

    .item {
      min-width: 75px;
      min-height: 75px;
      display: grid;
      place-items: center;
      padding: 10px;
      border-radius: 9px;
      background: #b7c9ff;
      color: #17398f;
      font-weight: bold;
    }

    .item:nth-child(even) {
      background: #83a3ff;
    }

    .codebar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding: 15px 20px;
      border-top: 1px solid #e1e5eb;
      font-family: monospace;
      font-size: 12px;
      color: #596679;
    }

    .codebar span {
      color: #2f67f6;
    }

    @media (max-width: 750px) {
      body {
        padding: 18px;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Flex & Grid Playground</h1>

    <p class="intro">
      Change the CSS properties below and see the layout update in real time.
    </p>

    <section class="layout">
      <aside class="panel">
        <div class="panel-header">
          <h2>Container Controls</h2>
          <button id="reset">Reset</button>
        </div>

        <div class="control">
          <label for="display">display</label>
          <select id="display">
            <option value="flex">flex</option>
            <option value="grid">grid</option>
            <option value="block">block</option>
          </select>
        </div>

        <div class="control">
          <label for="direction">flex-direction</label>
          <select id="direction">
            <option value="row">row</option>
            <option value="column">column</option>
            <option value="row-reverse">row-reverse</option>
            <option value="column-reverse">column-reverse</option>
          </select>
        </div>

        <div class="control">
          <label for="justify">justify-content</label>
          <select id="justify">
            <option value="flex-start">flex-start</option>
            <option value="center">center</option>
            <option value="flex-end">flex-end</option>
            <option value="space-between">space-between</option>
            <option value="space-around">space-around</option>
            <option value="space-evenly">space-evenly</option>
          </select>
        </div>

        <div class="control">
          <label for="align">align-items</label>
          <select id="align">
            <option value="stretch">stretch</option>
            <option value="flex-start">flex-start</option>
            <option value="center">center</option>
            <option value="flex-end">flex-end</option>
            <option value="baseline">baseline</option>
          </select>
        </div>

        <div class="control">
          <label for="columns">grid-template-columns</label>
          <select id="columns">
            <option value="1fr 1fr">1fr 1fr</option>
            <option value="1fr 1fr 1fr">1fr 1fr 1fr</option>
            <option value="repeat(4, 1fr)">repeat(4, 1fr)</option>
            <option value="2fr 1fr">2fr 1fr</option>
          </select>
        </div>
      </aside>

      <section class="preview">
        <div class="preview-header">
          <h2>Preview</h2>
          <span id="liveText">Live preview</span>
        </div>

        <div class="stage">
          <div id="container">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
            <div class="item">Item 4</div>
            <div class="item">Item 5</div>
          </div>
        </div>

        <div class="codebar">
          <div>display: <span id="codeDisplay">flex</span>;</div>
          <div>flex-direction: <span id="codeDirection">row</span>;</div>
          <div>justify-content: <span id="codeJustify">flex-start</span>;</div>
          <div>align-items: <span id="codeAlign">stretch</span>;</div>
          <div>
            grid-template-columns:
            <span id="codeColumns">1fr 1fr</span>;
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const container = document.getElementById("container");

    const controls = {
      display: document.getElementById("display"),
      direction: document.getElementById("direction"),
      justify: document.getElementById("justify"),
      align: document.getElementById("align"),
      columns: document.getElementById("columns")
    };

    const codeLabels = {
      display: document.getElementById("codeDisplay"),
      direction: document.getElementById("codeDirection"),
      justify: document.getElementById("codeJustify"),
      align: document.getElementById("codeAlign"),
      columns: document.getElementById("codeColumns")
    };

    const defaults = {
      display: "flex",
      direction: "row",
      justify: "flex-start",
      align: "stretch",
      columns: "1fr 1fr"
    };

    function updateLayout() {
      const values = {
        display: controls.display.value,
        direction: controls.direction.value,
        justify: controls.justify.value,
        align: controls.align.value,
        columns: controls.columns.value
      };

      container.style.display = values.display;
      container.style.flexDirection = values.direction;
      container.style.justifyContent = values.justify;
      container.style.alignItems = values.align;
      container.style.gridTemplateColumns = values.columns;

      codeLabels.display.textContent = values.display;
      codeLabels.direction.textContent = values.direction;
      codeLabels.justify.textContent = values.justify;
      codeLabels.align.textContent = values.align;
      codeLabels.columns.textContent = values.columns;

      document.getElementById("liveText").textContent =
        `Live · ${values.display} layout`;
    }

    Object.values(controls).forEach(control => {
      control.addEventListener("change", updateLayout);
    });

    document.getElementById("reset").addEventListener("click", () => {
      Object.entries(defaults).forEach(([key, value]) => {
        controls[key].value = value;
      });

      updateLayout();
    });

    updateLayout();
  </script>
</body>
</html>
